[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quarry"
version = "0.1.0"
description = "Quarry — Windows malware analysis workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "aiosqlite>=0.20",
    "click>=8.1",
    "jinja2>=3.1",
    "pefile>=2023.2.7",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
    "pywintrace>=0.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
quarry = "quarry.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["quarry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
